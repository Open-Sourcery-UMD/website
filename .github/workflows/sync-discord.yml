name: Sync Discord

on:
  schedule:
    # Daily at 10:45 AM EST = 15:45 UTC, after Update Projects has run
    - cron: '45 15 * * *'
  workflow_dispatch:

jobs:
  sync-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Discord sync
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          NEXT_PUBLIC_GITHUB_ORG: ${{ vars.GITHUB_ORG || 'Open-Sourcery-UMD' }}
        run: npx tsx scripts/sync-discord.ts
