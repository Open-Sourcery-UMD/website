name: Sync Discord

on:
  schedule:
    # 9:45am daily, New York time. Cron only speaks UTC, so there are two:
    # one for daylight saving, one for standard time. The job itself skips
    # whichever one isn't today's.
    - cron: '45 13 * * *'
    - cron: '45 14 * * *'
  workflow_dispatch:

jobs:
  sync-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Discord sync
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          NEXT_PUBLIC_GITHUB_ORG: ${{ vars.GITHUB_ORG || 'Open-Sourcery-UMD' }}
        run: |
          # Only the schedule matching today's New York offset does the work
          if [ "$(TZ=America/New_York date +%z)" = "-0400" ]; then
            todays_cron='45 13 * * *'
          else
            todays_cron='45 14 * * *'
          fi
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" != "$todays_cron" ]; then
            echo "Not 9:45am in New York today; the other schedule covers it."
            exit 0
          fi
          npx tsx scripts/sync-discord.ts
